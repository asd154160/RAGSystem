# GPU 加速覆盖文件
# 用法: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# 需要: NVIDIA GPU + nvidia-container-toolkit

services:
  backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
